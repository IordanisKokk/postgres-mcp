services:
  test-postgres:
    image: postgres:16-alpine
    container_name: test-postgres-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-test_database}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-test_database}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  test-postgres-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: test-postgres-mcp
    depends_on:
      test-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@test-postgres:5432/${POSTGRES_DB:-test_database}
      PORT: 3000
      MCP_PATH: /mcp
      QUERY_TIMEOUT_MS: 15000
      MAX_ROWS: 500
      ALLOWED_SCHEMAS: public
    ports:
      - "${MCP_PORT:-3001}:3000"
    restart: unless-stopped

volumes:
  test_postgres_data:
