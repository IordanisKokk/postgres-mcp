services:
  postgres-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres-mcp-server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/postgres}
      PORT: ${PORT:-3000}
      MCP_PATH: ${MCP_PATH:-/mcp}
      QUERY_TIMEOUT_MS: ${QUERY_TIMEOUT_MS:-10000}
      MAX_ROWS: ${MAX_ROWS:-200}
      ALLOWED_SCHEMAS: ${ALLOWED_SCHEMAS:-public}
    ports:
      - "3000:3000"
    restart: unless-stopped
